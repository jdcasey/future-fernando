name: security

# Lightweight security scan for a pure-bash project:
#   - ShellCheck  : static analysis of every shell script (catches the
#                   unquoted-var / word-splitting class of bugs).
#   - gitleaks    : secret scan across the full commit history.
# (CodeQL is intentionally omitted — it has no shell/bash support.)
#
# Both scanners FLOAT to their latest release rather than being pinned. For a
# non-sensitive public repo the priority is detection freshness (Axis 1): each
# run should use current secret-detection rules and shell checks so it protects
# anyone using the tool, not just what was known at pin time. The weekly
# schedule re-scans existing code/history against whatever rules are current.
# Trade-off accepted: builds are not bit-for-bit reproducible, and a tool
# release could in principle change behavior under us.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'   # Mondays 09:17 UTC — re-scan with current rules
  workflow_dispatch:

# Least privilege: these jobs only read the repo.
permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck (static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck (latest)
        run: |
          set -euo pipefail
          url=$(curl -sSL https://api.github.com/repos/koalaman/shellcheck/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux\\.x86_64\\.tar\\.xz$")) | .browser_download_url' | head -1)
          echo "downloading: $url"
          curl -sSL "$url" -o shellcheck.tar.xz
          tar -xf shellcheck.tar.xz
          sudo install shellcheck-v*/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: Lint shell scripts
        # --severity=warning: adopt new warning/error checks as ShellCheck evolves
        # (Axis 1) while info-level style churn (e.g. SC2015) can't spuriously
        # break the build when the floated version changes its defaults.
        run: shellcheck --severity=warning -x bin/* install.sh uninstall.sh lib/*.sh

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the scan covers every commit
      - name: Install gitleaks (latest)
        run: |
          set -euo pipefail
          url=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux_(x64|amd64)\\.tar\\.gz$")) | .browser_download_url' | head -1)
          echo "downloading: $url"
          curl -sSL "$url" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan history for secrets
        # `git` (not the deprecated `detect`) so a future floated release won't
        # remove the subcommand under us. Scans full commit history.
        run: gitleaks git . --redact --no-banner
