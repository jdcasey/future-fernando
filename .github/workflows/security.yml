name: security

# Lightweight security scan for a pure-bash project:
#   - ShellCheck  : static analysis of every shell script (catches the
#                   unquoted-var / word-splitting class of bugs).
#   - gitleaks    : secret scan across the full commit history.
# (CodeQL is intentionally omitted — it has no shell/bash support.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: these jobs only read the repo.
permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck (static analysis)
    runs-on: ubuntu-latest
    env:
      # Pinned + checksum-verified so CI matches local exactly. The runner's
      # bundled ShellCheck version drifts and toggles info-level checks (e.g.
      # SC2015), which otherwise makes "clean locally" fail in CI.
      # To bump: set the version, download the linux.x86_64.tar.xz, update sha256.
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck (pinned, verified)
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSL "$url" -o shellcheck.tar.xz
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xf shellcheck.tar.xz
          sudo install "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Lint shell scripts
        run: shellcheck -x bin/* install.sh uninstall.sh lib/*.sh

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    env:
      # Pinned + checksum-verified for reproducibility and supply-chain safety.
      # To bump: set the new version, download the linux_x64 tarball, and update
      # the sha256 to match that artifact.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the scan covers every commit
      - name: Install gitleaks (pinned, verified)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "$url" -o gitleaks.tgz
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan history for secrets
        run: gitleaks detect --source . --redact --no-banner
